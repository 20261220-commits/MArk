/* ---------- touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none;z-index:5}
#joy{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.6)}
.tb{position:absolute;width:62px;height:62px;pointer-events:auto;touch-action:none;font:inherit;font-size:13px;color:#fff;background:rgba(60,60,60,.6);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.25),inset -2px -2px 0 rgba(0,0,0,.35);text-shadow:1px 1px 0 #000;padding:0}
.tb.down,.tb.on{background:rgba(140,150,200,.8)}
#tJump{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(110px + env(safe-area-inset-bottom,0px))}
#tSneak{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#tAttack{right:calc(92px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#tUse{right:calc(92px + env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px))}
#tInv{left:calc(160px + env(safe-area-inset-left,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:52px;height:44px}
#tDrop{left:calc(160px + env(safe-area-inset-left,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:52px;height:44px}
#tPause{top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:44px;height:40px}
#tChat{top:calc(8px + env(safe-area-inset-top,0px));right:calc(60px + env(safe-area-inset-right,0px));width:44px;height:40px}
body.touch #bottom{bottom:calc(4px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div class="ov" id="ovWater" hidden></div>
<div class="ov" id="ovSnow" hidden></div>
<div class="ov" id="ovFire" hidden></div>
<div class="ov" id="ovHurt"></div>
<div class="ov" id="ovSpy" hidden></div>
<div id="hud">
  <div id="cross"></div>
  <div id="attackInd" hidden><i></i></div>
  <div id="debug" hidden></div>
  <div id="chatLog"></div>
  <div id="heldName"></div>
  <div id="toast"></div>
  <div id="bottom">
    <div id="bars"><div id="armorbar"></div><div id="air"></div><div id="hearts"></div><div id="food"></div></div>
    <div id="xpbar"><i></i><b id="xplvl"></b></div>
    <div id="hotbar"></div>
  </div>
</div>
<div class="ov" id="ovSleep"></div>
<div id="touch" hidden>
  <div id="joy"><div id="knob"></div></div>
  <button class="tb" id="tJump" type="button">점프</button>
  <button class="tb" id="tSneak" type="button">웅크리기</button>
  <button class="tb" id="tAttack" type="button">캐기</button>
  <button class="tb" id="tUse" type="button">놓기</button>
  <button class="tb" id="tInv" type="button">가방</button>
  <button class="tb" id="tDrop" type="button">버리기</button>
  <button class="tb" id="tChat" type="button">/</button>
  <button class="tb" id="tPause" type="button">II</button>
</div>
<div id="screen" hidden></div>
<div id="tooltip" hidden></div>
<div id="chat" hidden><input id="chatIn" maxlength="256" autocomplete="off" spellcheck="false"></div>
<div id="adv"></div>
<div id="menu"></div>
<!-- scripts: order matters (shared globals) -->
<script src="vendor/three.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/pack.js"></script>
<script src="js/items.js"></script>
<script src="js/textures.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/render.js"></script>
<script src="js/entities.js"></script>
<script src="js/redstone.js"></script>
<script src="js/inventory.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
