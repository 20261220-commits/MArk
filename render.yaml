# Render 블루프린트: 대시보드에서 New → Blueprint 로 이 저장소를 고르면 아래 설정으로 서버가 만들어집니다.
services:
  - type: web
    name: nemo-server
    runtime: node
    plan: free
    buildCommand: echo "의존성 없음"
    startCommand: node tools/server.js
    healthCheckPath: /
    envVars:
      - key: WORLD
        value: world
    # 무료 플랜은 서버가 다시 시작될 때(재배포, 15분 동안 접속이 없어 잠들었다 깨어날 때) 파일이 지워져 세계가 사라집니다.
    # 세계를 계속 남기려면 유료 플랜으로 바꾸고 아래 디스크와 WORLDS_DIR 의 주석을 푸세요.
    #   - key: WORLDS_DIR
    #     value: /var/data/worlds
    # disk:
    #   name: worlds
    #   mountPath: /var/data
    #   sizeGB: 1
